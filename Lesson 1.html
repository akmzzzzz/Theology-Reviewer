    body {

      padding: 0.75rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);

      height: 28px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;

    .option-item.wrong {

      color: var(--text-muted);
      min-width: 1.25rem;

</head>

    category: "Sources & Invocation",
    q: "Under what category are Human Reason, Philosophers, and History classified in theology?",
    options: ["Constitutive Sources", "Infallible Interpretative Sources", "Auxiliary Sources", "Dogmatic Treatises"],
    answer: 2,
    note: "Auxiliary sources include Human Reason, Philosophers, and History/human traditions."
  },

  // 6. Invocation to the Holy Spirit
  {
    category: "Sources & Invocation",
    q: "What is the ultimate purpose of the Invocation to the Holy Spirit in theological study?",
    options: [
      "To bypass the need for reading texts or study",
      "To enlighten minds and hearts so actions and understanding align with God's will for His glorification",
      "To receive immediate personal revelations that supersede the Church canon",
      "To debate secular philosophers on equal academic footing"
    ],
    answer: 1,
    note: "The Invocation asks the Holy Spirit to enlighten minds and hearts, granting grace to respond to the Father's love through Christ and align with God's will for His glorification."
  }
];

let activeFilter = 'ALL';
let filteredList = [...quizData];
let currentIndex = 0;
let userAnswers = {};

const qText = document.getElementById('question-text');
const optionsBox = document.getElementById('options-box');
const explanationBox = document.getElementById('explanation-box');
const catBadge = document.getElementById('cat-badge');
const qIndicator = document.getElementById('question-indicator');
const scoreIndicator = document.getElementById('score-indicator');
const progressBar = document.getElementById('progress-bar');
const gridJump = document.getElementById('grid-jump');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const quizCard = document.getElementById('quiz-card');
const summaryCard = document.getElementById('summary-card');

function initGrid() {
  gridJump.innerHTML = '';
  filteredList.forEach((_, idx) => {
    const btn = document.createElement('button');
    btn.className = 'grid-btn';
    btn.textContent = idx + 1;
    btn.onclick = () => jumpToQuestion(idx);
    gridJump.appendChild(btn);
  });
}

function updateGridStyles() {
  const btns = gridJump.querySelectorAll('.grid-btn');
  btns.forEach((btn, idx) => {
    btn.className = 'grid-btn';
    if (idx === currentIndex) btn.classList.add('current');
    if (userAnswers[idx] !== undefined) {
      if (userAnswers[idx] === filteredList[idx].answer) {
        btn.classList.add('answered-correct');
      } else {
        btn.classList.add('answered-wrong');
      }
    }
  });
}

function renderQuestion() {
  const item = filteredList[currentIndex];
  catBadge.textContent = item.category;
  qText.textContent = item.q;
  qIndicator.textContent = `Question ${currentIndex + 1} of ${filteredList.length}`;
  
  optionsBox.innerHTML = '';
  explanationBox.className = 'explanation-panel';
  explanationBox.innerHTML = '';

  const hasAnswered = userAnswers[currentIndex] !== undefined;

  item.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'option-item';
    if (hasAnswered) div.classList.add('disabled');

    const key = document.createElement('span');
    key.className = 'option-key';
    key.textContent = `${String.fromCharCode(65 + idx)}.`;

    const label = document.createElement('span');
    label.textContent = opt;

    div.appendChild(key);
    div.appendChild(label);

    if (hasAnswered) {
      if (idx === item.answer) div.classList.add('correct');
      if (userAnswers[currentIndex] === idx && idx !== item.answer) div.classList.add('wrong');
    } else {
      div.onclick = () => selectAnswer(idx);
    }

    optionsBox.appendChild(div);
  });

  if (hasAnswered) {
    showExplanation(userAnswers[currentIndex] === item.answer);
  }

  prevBtn.disabled = currentIndex === 0;
  nextBtn.textContent = (currentIndex === filteredList.length - 1) ? 'Finish & Review' : 'Next →';
  updateProgress();
  updateGridStyles();
}

function selectAnswer(selectedIdx) {
  if (userAnswers[currentIndex] !== undefined) return;
  userAnswers[currentIndex] = selectedIdx;
  renderQuestion();
}

function showExplanation(isCorrect) {
  const item = filteredList[currentIndex];
  explanationBox.classList.add('show', isCorrect ? 'correct' : 'wrong');
  explanationBox.innerHTML = `<strong>${isCorrect ? '✓ Correct!' : '✗ Incorrect.'}</strong> ${item.note}`;
}

function updateProgress() {
  const answeredCount = Object.keys(userAnswers).length;
  const correctCount = Object.keys(userAnswers).filter(k => userAnswers[k] === filteredList[k].answer).length;
  scoreIndicator.textContent = `Score: ${correctCount} / ${answeredCount}`;
  progressBar.style.width = `${((currentIndex + 1) / filteredList.length) * 100}%`;
}

function jumpToQuestion(idx) {
  currentIndex = idx;
  renderQuestion();
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function nextQuestion() {
  if (currentIndex < filteredList.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showSummary();
  }
}

function setCategory(cat) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.includes(cat) || (cat === 'ALL' && b.textContent.includes('All')));
  });

  filteredList = (cat === 'ALL') ? [...quizData] : quizData.filter(d => d.category === cat);
  currentIndex = 0;
  userAnswers = {};
  quizCard.style.display = 'block';
  summaryCard.style.display = 'none';
  initGrid();
  renderQuestion();
}

function showSummary() {
  quizCard.style.display = 'none';
  summaryCard.style.display = 'block';

  const total = filteredList.length;
  const correct = Object.keys(userAnswers).filter(k => userAnswers[k] === filteredList[k].answer).length;
  const pct = Math.round((correct / total) * 100) || 0;

  document.getElementById('final-score-display').textContent = `${pct}% (${correct}/${total})`;
  
  let remark = '';
  if (pct === 100) remark = 'Flawless recall of all concepts, authors, and source classifications!';
  else if (pct >= 80) remark = 'Excellent mastery of theological definitions, historical periods, and divisions.';
  else if (pct >= 60) remark = 'Solid grasp. Review the distinctions between sources and dogmatic branches.';
  else remark = 'Recommended to re-read the lesson notes on historical development and sources.';
  document.getElementById('final-remark').textContent = remark;

  const reviewBox = document.getElementById('review-container');
  reviewBox.innerHTML = '';

  filteredList.forEach((item, idx) => {
    const userChoice = userAnswers[idx];
    const isCorrect = userChoice === item.answer;
    const div = document.createElement('div');
    div.className = `review-item ${isCorrect ? 'pass' : 'fail'}`;

    div.innerHTML = `
      <strong>Q${idx + 1}: ${item.q}</strong><br/>
      <span style="color: ${isCorrect ? 'var(--correct-text)' : 'var(--wrong-text)'}">
        Your Answer: ${userChoice !== undefined ? item.options[userChoice] : 'Unanswered'}
      </span><br/>
      ${!isCorrect ? `<span>Correct: <strong>${item.options[item.answer]}</strong></span><br/>` : ''}
      <small style="color: var(--text-muted);">${item.note}</small>
    `;
    reviewBox.appendChild(div);
  });
}

function resetQuiz() {
  userAnswers = {};
  currentIndex = 0;
  summaryCard.style.display = 'none';
  quizCard.style.display = 'block';
  renderQuestion();
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
}

// Initial Run
initGrid();
renderQuestion();
</script>
</body>
</html>
